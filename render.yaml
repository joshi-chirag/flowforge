databases:
  - name: flowforge-db
    databaseName: flowforge
    user: flowforge
    plan: free

services:

  # 2. Broker & Cache (Redis)
  - type: keyvalue
    name: flowforge-redis
    plan: free
    ipAllowList: [] # Access isolated only to Render services

  # 3. Daphne ASGI Web Server
  - type: web
    name: flowforge-web
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT flowforge.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # Set manually in the Render dashboard

  # 4. Distributed Celery Background Worker
  - type: worker
    name: flowforge-celery-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A flowforge worker --loglevel=info
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString

  # 5. Celery Beat Scheduler
  - type: worker
    name: flowforge-celery-beat
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A flowforge beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: flowforge-redis
          property: connectionString
